<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Carrom Studio — Pro Tabletop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0f1115;
      --panel-bg: #181b22;
      --accent: #e5a93c;
      --accent-hover: #f3bc55;
      --text-main: #f4f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at top, #1c2029 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      min-height: 100vh; overflow: hidden;
    }
    header {
      width: 100%; max-width: 680px; padding: 12px 18px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(24, 27, 34, 0.85); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand { font-weight: 800; letter-spacing: 0.5px; font-size: 1.05rem; color: var(--accent); }
    .modes { display: flex; gap: 6px; }
    button {
      background: #252a34; color: var(--text-main); border: 1px solid rgba(255,255,255,0.08);
      padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease;
    }
    button:hover { background: #2f3542; }
    button.active { background: var(--accent); color: #111; border-color: var(--accent); }
    .scoreboard {
      width: 100%; max-width: 540px; display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; margin-top: 6px; background: var(--panel-bg);
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
    }
    .player-box { display: flex; flex-direction: column; gap: 2px; }
    .player-box.right { text-align: right; }
    .p-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .p-score { font-size: 1.35rem; font-weight: 800; }
    .turn-badge {
      padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 700;
      background: rgba(229, 169, 60, 0.15); color: var(--accent); border: 1px solid rgba(229, 169, 60, 0.35);
    }
    #canvas-wrap {
      position: relative; display: flex; align-items: center; justify-content: center;
      flex: 1; width: 100%; max-width: 560px; padding: 10px;
    }
    canvas {
      border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.08);
      touch-action: none; max-width: 100%; max-height: 100%;
    }
    .controls-bar {
      width: 100%; max-width: 540px; padding: 10px 18px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row span { font-size: 0.75rem; color: var(--text-muted); min-width: 65px; }
    input[type="range"] {
      flex: 1; accent-color: var(--accent); height: 6px; border-radius: 4px; cursor: pointer;
    }
    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 22px; width: 100%; max-width: 380px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal h3 { font-size: 1.1rem; color: var(--accent); }
    .modal p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
    .room-code-box {
      background: #0f1115; border: 1px dashed var(--accent); border-radius: 10px;
      padding: 12px; text-align: center; font-size: 1.5rem; font-weight: 800;
      letter-spacing: 4px; color: var(--accent); cursor: pointer;
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; background: #0f1115; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 10px 12px; color: #fff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px; outline: none;
    }
    .status-msg { font-size: 0.8rem; min-height: 18px; color: var(--success); }
    .status-msg.err { color: var(--danger); }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="brand">CARROM STUDIO</div>
    <div class="modes">
      <button id="btn-ai" class="active">vs AI</button>
      <button id="btn-pvp">Pass & Play</button>
      <button id="btn-online">Online</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="player-box">
      <span class="p-label" id="p1-name">White (You)</span>
      <span class="p-score" id="p1-score">0</span>
    </div>
    <div class="turn-badge" id="turn-indicator">WHITE'S TURN</div>
    <div class="player-box right">
      <span class="p-label" id="p2-name">Black (AI)</span>
      <span class="p-score" id="p2-score">0</span>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="board" width="600" height="600"></canvas>
  </div>

  <div class="controls-bar">
    <div class="slider-row">
      <span>POSITION</span>
      <input type="range" id="striker-pos" min="155" max="445" value="300" />
    </div>
  </div>

  <!-- Supabase Multiplayer Modal -->
  <div class="modal-backdrop" id="online-modal">
    <div class="modal">
      <h3>Online Multiplayer</h3>
      <p>Create a private room and share the 5-character code with your friend, or enter a code to join.</p>
      <button id="btn-create-room" class="active">Create New Room</button>
      <div id="created-room-area" style="display:none;">
        <div class="room-code-box" id="display-room-code" title="Click to copy">-----</div>
      </div>
      <div class="input-row">
        <input type="text" id="join-code-input" maxlength="5" placeholder="CODE" />
        <button id="btn-join-room">Join</button>
      </div>
      <div class="status-msg" id="online-status"></div>
      <button id="btn-close-modal" style="margin-top:4px;">Close</button>
    </div>
  </div>
