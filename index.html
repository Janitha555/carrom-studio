    function applySiteUpdatingUI(updating) {
      isSiteUpdating = !!updating;
      if (maintScreenEl) {
        maintScreenEl.classList.toggle('active', isSiteUpdating);
      }
      if (isSiteUpdating) {
        if (homeScreenEl) homeScreenEl.classList.add('hidden');

        }
      } else {
        if (!isAdminLoggedIn && homeScreenEl) {
          homeScreenEl.classList.remove('hidden');
        }
      }
      if (maintToggleEl) {
        maintToggleEl.checked = isSiteUpdating;
      }
      if (toggleStateLabelEl) {
        toggleStateLabelEl.textContent = isSiteUpdating
          ? 'Updating / Processing Screen (Active)'
          : 'Game Home Screen (Live)';
      }

    async function loadSiteStatusFromSupabase() {
      if (!sb) {
        applySiteUpdatingUI(false);
        hideBootGate();
        return;
      }
      try {
        const { data, error } = await sb
          .from(SITE_CONFIG_TABLE)
          .select('is_updating')
          .eq('id', SITE_CONFIG_ROW_ID)
          .maybeSingle();

        if (!error && data && typeof data.is_updating === 'boolean') {
          applySiteUpdatingUI(data.is_updating);
        } else {
          applySiteUpdatingUI(false);
        }
      } catch (_) {
        applySiteUpdatingUI(false);
      } finally {
        hideBootGate();
      }
    }

    function subscribeToSiteStatus() {
      if (!sb) return;
      if (siteSettingsChannel) {
        try { sb.removeChannel(siteSettingsChannel); } catch (_) {}
      }
      siteSettingsChannel = sb
        .channel('site-status-sync')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: SITE_CONFIG_TABLE,
            filter: `id=eq.${SITE_CONFIG_ROW_ID}`
          },
          (payload) => {
            const nextVal = payload?.new?.is_updating;
            if (typeof nextVal === 'boolean') {
              applySiteUpdatingUI(nextVal);
              if (!nextVal && isAdminLoggedIn && adminModalEl) {
                adminModalEl.classList.remove('open');
                isAdminLoggedIn = false;
                if (homeScreenEl) homeScreenEl.classList.remove('hidden');
              }
            }
          }
        )
        .subscribe();
    }

    async function setSiteUpdatingInSupabase(nextUpdating) {
      if (!sb) {
        if (adminStatusEl) {
          adminStatusEl.textContent = 'Supabase client not initialized.';
          adminStatusEl.className = 'status-msg err';
        }
        return false;
      }
      const { error } = await sb
        .from(SITE_CONFIG_TABLE)
        .upsert(
          {
            id: SITE_CONFIG_ROW_ID,
            is_updating: !!nextUpdating,
            updated_at: new Date().toISOString()
          },
          { onConflict: 'id' }
        );

      if (error) {
        if (adminStatusEl) {
          adminStatusEl.textContent = `Update failed: ${error.message}`;
          adminStatusEl.className = 'status-msg err';
        }
        return false;
      }
      applySiteUpdatingUI(!!nextUpdating);
      if (adminStatusEl) {
        adminStatusEl.textContent = nextUpdating
          ? 'Updating Screen enabled for all users.'
          : 'Game Home Screen restored for all users.';
        adminStatusEl.className = 'status-msg';
      }
      return true;
    }

    function refreshAdminModalView() {
      if (!adminLoginBoxEl || !adminControlsBoxEl) return;
      if (isAdminLoggedIn) {
        adminLoginBoxEl.style.display = 'none';
        adminControlsBoxEl.style.display = 'flex';
      } else {
        adminLoginBoxEl.style.display = 'flex';
        adminControlsBoxEl.style.display = 'none';
      }
    }

    function openAdminModal() {
      if (adminStatusEl) {
        adminStatusEl.textContent = '';
        adminStatusEl.className = 'status-msg';
      }
      refreshAdminModalView();
      if (adminModalEl) adminModalEl.classList.add('open');
    }

    document.getElementById('btn-open-admin').addEventListener('click', openAdminModal);
    document.getElementById('btn-maint-admin').addEventListener('click', openAdminModal);

    document.getElementById('btn-close-admin').addEventListener('click', () => {
      if (adminModalEl) adminModalEl.classList.remove('open');
    });

    document.getElementById('btn-admin-login').addEventListener('click', async () => {
      const emailInput = document.getElementById('admin-username').value.trim();
      const passwordInput = document.getElementById('admin-password').value;

      if (!emailInput || !passwordInput) {
        adminStatusEl.textContent = 'Enter admin email and password.';
        adminStatusEl.className = 'status-msg err';
        return;
      }
      if (!sb) {
        adminStatusEl.textContent = 'Supabase unavailable.';
        adminStatusEl.className = 'status-msg err';
        return;
      }

      adminStatusEl.textContent = 'Authenticating admin...';
      adminStatusEl.className = 'status-msg';

      const { data, error } = await sb.auth.signInWithPassword({
        email: emailInput,
        password: passwordInput
      });

      if (error || !data?.user) {
        adminStatusEl.textContent = error?.message || 'Invalid admin credentials.';
        adminStatusEl.className = 'status-msg err';
        return;
      }

      isAdminLoggedIn = true;
      refreshAdminModalView();
      adminStatusEl.textContent = `Signed in as ${data.user.email}`;
      adminStatusEl.className = 'status-msg';
    });

    document.getElementById('btn-admin-logout').addEventListener('click', async () => {
      try {
        if (sb) await sb.auth.signOut();
      } catch (_) {}
      isAdminLoggedIn = false;
      refreshAdminModalView();
      adminStatusEl.textContent = 'Logged out.';
      adminStatusEl.className = 'status-msg';
    });

    maintToggleEl.addEventListener('change', async (e) => {
      if (!isAdminLoggedIn) {
        e.target.checked = isSiteUpdating;
        adminStatusEl.textContent = 'Admin login required.';
        adminStatusEl.className = 'status-msg err';
        return;
      }
      const desiredState = !!e.target.checked;
      const ok = await setSiteUpdatingInSupabase(desiredState);
      if (!ok) {
        e.target.checked = isSiteUpdating;
      }
    });

    /* =========================================================
       HOME SCREEN NAVIGATION

    function enterFromHome(actionFn) {
      if (isSiteUpdating) {

      if (homeScreenEl) homeScreenEl.classList.add('hidden');
      actionFn();

    document.getElementById('btn-home').addEventListener('click', () => {
      if (isSiteUpdating) {
        if (maintScreenEl) maintScreenEl.classList.add('active');

    /* =========================================================
       SOUND EFFECTS ENGINE (WEB AUDIO SYNTHESIZER)
       ========================================================= */
    const SoundFX = (() => {
      let ctx = null;
      let enabled = true;

      function ensureCtx() {
        if (!enabled) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playClick(impactSpeed = 1) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        const clamped = Math.min(2.2, Math.max(0.25, impactSpeed));
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190 + clamped * 95, now);
        osc.frequency.exponentialRampToValueAtTime(58, now + 0.055);
        gain.gain.setValueAtTime(Math.min(0.32, 0.08 * clamped), now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }

      function playStrike(powerRatio = 0.7) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150 + powerRatio * 120, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.11);
        gain.gain.setValueAtTime(0.14 + powerRatio * 0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.125);
      }

      function playPocket(isQueen = false) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const notes = isQueen ? [523.25, 659.25, 783.99, 1046.5] : [440, 587.33];
        notes.forEach((freq, idx) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = isQueen ? 'triangle' : 'sine';
          const start = now + idx * 0.065;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.14, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(start);
          osc.stop(start + 0.19);
        });
      }

      function playFoul() {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(115, now + 0.22);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      function playVictory() {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const fanfare = [523.25, 659.25, 783.99, 1046.5];
        fanfare.forEach((freq, i) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          const t = now + i * 0.11;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.34);
        });
      }

      return {
        playClick,
        playStrike,
        playPocket,
        playFoul,
        playVictory,
        setEnabled(val) { enabled = !!val; },
        isEnabled() { return enabled; }
      };
    })();

    /* =========================================================
       ROUND TIMER & FLYING COIN ANIMATION HELPERS
       ========================================================= */
    function resetTurnTimer() {
      turnSecondsLeft = TURN_DURATION_SEC;
      updateTurnTimerUI();
      if (turnTimerInterval) clearInterval(turnTimerInterval);
      turnTimerInterval = setInterval(() => {
        if (isSiteUpdating) return;
        if (victoryModal && victoryModal.classList.contains('open')) return;
        if (gameState.phase !== 'AIM') return;
        if (mode === 'ONLINE' && gameState.turn !== myRole) return;
        if (mode === 'AI' && gameState.turn === 'BLACK') return;

        turnSecondsLeft = Math.max(0, turnSecondsLeft - 1);
        updateTurnTimerUI();

        if (turnSecondsLeft <= 0) {
          handleTurnTimeout();
        }
      }, 1000);
    }

    function updateTurnTimerUI() {
      if (!turnTimerEl) return;
      turnTimerEl.textContent = `⏱ ${turnSecondsLeft}s`;
      turnTimerEl.classList.toggle('urgent', turnSecondsLeft <= 6);
    }

    function handleTurnTimeout() {
      if (gameState.phase !== 'AIM') return;
      SoundFX.playFoul();
      gameState.turn = gameState.turn === 'WHITE' ? 'BLACK' : 'WHITE';
      gameState.pocketedThisTurn = [];
      gameState.strikerPocketedThisTurn = false;
      resetStrikerForTurn();
      gameState.phase = 'AIM';
      updateScoreboard();
      resetTurnTimer();
      broadcastStateIfOnline();
      if (mode === 'AI' && gameState.turn === 'BLACK') {
        scheduleAITurn();
      }
    }

    function launchFlyingCoinToTray(coin) {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const scaleX = rect.width / BOARD_SIZE;
      const scaleY = rect.height / BOARD_SIZE;
      const startX = rect.left + coin.x * scaleX;
      const startY = rect.top + coin.y * scaleY;

      const targetTray = coin.type === 'WHITE' ? p1CoinsEl : (coin.type === 'BLACK' ? p2CoinsEl : (gameState.turn === 'WHITE' ? p1CoinsEl : p2CoinsEl));
      const targetRect = targetTray ? targetTray.getBoundingClientRect() : { left: rect.left + rect.width * 0.5, top: rect.top };
      const endX = targetRect.left + targetRect.width * 0.5;
      const endY = targetRect.top + targetRect.height * 0.5;

      const el = document.createElement('div');
      el.className = 'flying-coin-dom';
      el.style.left = `${startX}px`;
      el.style.top = `${startY}px`;
      if (coin.type === 'WHITE') {
        el.style.background = 'radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1)';
        el.style.border = '1.5px solid #ffffff';
        el.style.boxShadow = '0 0 12px rgba(255,255,255,0.85)';
      } else if (coin.type === 'BLACK') {
        el.style.background = 'radial-gradient(circle at 35% 35%, #64748b, #0f172a)';
        el.style.border = '1.5px solid #f59e0b';
        el.style.boxShadow = '0 0 12px rgba(245,158,11,0.75)';
      } else {
        el.style.background = 'radial-gradient(circle at 35% 35%, #fde047, #e11d48)';
        el.style.border = '1.5px solid #fef08a';
        el.style.boxShadow = '0 0 14px rgba(250,204,21,0.95)';
      }

      document.body.appendChild(el);
      requestAnimationFrame(() => {
        el.style.left = `${endX}px`;
        el.style.top = `${endY}px`;
        el.style.transform = 'translate(-50%, -50%) scale(0.55)';
        el.style.opacity = '0.25';
      });

      setTimeout(() => {
        el.remove();
      }, 690);
    }

    function showInfoModal(title, message, onClose = null) {
      document.getElementById('info-title').textContent = title;
      document.getElementById('info-message').textContent = message;
      const modal = document.getElementById('info-modal');
      const okBtn = document.getElementById('btn-info-ok');
      modal.classList.add('open');

      const handler = () => {
        modal.classList.remove('open');
        okBtn.removeEventListener('click', handler);
        if (typeof onClose === 'function') onClose();
      };
      okBtn.addEventListener('click', handler);
    }

    /* =========================================================
       RACK SETUP & STRIKER POSITIONING
       ========================================================= */
    function createInitialCoins() {
      const cx = 300;
      const cy = 300;
      const d = COIN_RADIUS * 2.06;
      const coins = [];
      let idCounter = 1;

      coins.push({ id: idCounter++, type: 'QUEEN', x: cx, y: cy, vx: 0, vy: 0, r: COIN_RADIUS, pocketed: false });

      const ring1Count = 6;
      const r1 = d;
      for (let i = 0; i < ring1Count; i++) {
        const angle = (i * Math.PI * 2) / ring1Count - Math.PI / 2;
        const type = i % 2 === 0 ? 'WHITE' : 'BLACK';
        coins.push({
          id: idCounter++,
          type,
          x: cx + Math.cos(angle) * r1,
          y: cy + Math.sin(angle) * r1,
          vx: 0,
          vy: 0,
          r: COIN_RADIUS,
          pocketed: false,
        });
      }

      const ring2Count = 12;
      const r2 = d * 1.96;
      for (let i = 0; i < ring2Count; i++) {
        const angle = (i * Math.PI * 2) / ring2Count - Math.PI / 2;
        const type = i % 2 === 0 ? 'BLACK' : 'WHITE';
        coins.push({
          id: idCounter++,
          type,
          x: cx + Math.cos(angle) * r2,
          y: cy + Math.sin(angle) * r2,
          vx: 0,
          vy: 0,
          r: COIN_RADIUS,
          pocketed: false,
        });
      }

      return coins;
    }

    function getBaselineYForTurn(turn) {
      return turn === 'WHITE' ? WHITE_BASELINE_Y : BLACK_BASELINE_Y;
    }

    function resetStrikerForTurn() {
      const y = getBaselineYForTurn(gameState.turn);
      const x = Math.min(BASELINE_MAX_X, Math.max(BASELINE_MIN_X, Number(posSlider.value) || 300));
      gameState.striker = {
        x,
        y,
        vx: 0,
        vy: 0,
        r: STRIKER_RADIUS,
        active: true,
      };
      aimDrag.active = false;
      aimDrag.powerRatio = 0;
      powerFill.style.width = '0%';
    }

    function startNewGame(keepMode = true) {
      if (!keepMode) mode = 'AI';
      if (aiTimeoutId) {
        clearTimeout(aiTimeoutId);
        aiTimeoutId = null;
      }
      stopConfetti();
      victoryModal.classList.remove('open');

      gameState.turn = 'WHITE';
      gameState.phase = 'AIM';
      gameState.coins = createInitialCoins();
      gameState.queenState = 'ON_BOARD';
      gameState.queenPendingColor = null;
      gameState.pocketedThisTurn = [];
      gameState.strikerPocketedThisTurn = false;
      gameState.whitePocketedCount = 0;
      gameState.blackPocketedCount = 0;
      gameState.lastShotPower = 0;
      gameState.winner = null;
      gameState.winReason = '';
      particles = [];

      posSlider.value = 300;
      resetStrikerForTurn();
      updateScoreboard();
      resetTurnTimer();

      if (mode === 'ONLINE' && roomCode) {
        broadcastStateIfOnline();
      }
    }

    function returnQueenToCenter() {
      const queen = gameState.coins.find((c) => c.type === 'QUEEN');
      if (!queen) return;
      queen.pocketed = false;
      queen.vx = 0;
      queen.vy = 0;
      queen.x = 300;
      queen.y = 300;

      for (let attempt = 0; attempt < 36; attempt++) {
        const overlapping = [...gameState.coins, gameState.striker].some((other) => {
          if (!other || other.pocketed || other === queen) return false;
          const dx = queen.x - other.x;
          const dy = queen.y - other.y;
          const minDist = queen.r + other.r + 2;
          return dx * dx + dy * dy < minDist * minDist;
        });
        if (!overlapping) break;
        const angle = attempt * 0.55;
        const dist = 10 + attempt * 2.5;
        queen.x = 300 + Math.cos(angle) * dist;
        queen.y = 300 + Math.sin(angle) * dist;
      }
      gameState.queenState = 'ON_BOARD';
      gameState.queenPendingColor = null;
    }

    function penaltyReturnCoin(colorType) {
      const pocketedCoin = gameState.coins.find((c) => c.type === colorType && c.pocketed);
      if (pocketedCoin) {
        pocketedCoin.pocketed = false;
        pocketedCoin.vx = 0;
        pocketedCoin.vy = 0;
        pocketedCoin.x = 300;
        pocketedCoin.y = 300;
        if (colorType === 'WHITE') gameState.whitePocketedCount = Math.max(0, gameState.whitePocketedCount - 1);
        if (colorType === 'BLACK') gameState.blackPocketedCount = Math.max(0, gameState.blackPocketedCount - 1);
      }
    }

    /* =========================================================
       SCOREBOARD, COIN TRAY & VICTORY CELEBRATION
       ========================================================= */
    function renderCoinTray(containerEl, totalSlots, filledCount, fillClass, includeQueen = false, queenFilled = false) {
      if (!containerEl) return;
      containerEl.innerHTML = '';
      for (let i = 0; i < totalSlots; i++) {
        const dot = document.createElement('span');
        dot.className = 'coin-dot' + (i < filledCount ? ` ${fillClass}` : '');
        containerEl.appendChild(dot);
      }
      if (includeQueen) {
        const qDot = document.createElement('span');
        qDot.className = 'coin-dot queen-dot' + (queenFilled ? ' filled-queen' : '');
        qDot.title = 'Red Queen';
        containerEl.appendChild(qDot);
      }
    }

    function updateScoreboard() {
      const whiteRemaining = gameState.coins.filter((c) => c.type === 'WHITE' && !c.pocketed).length;
      const blackRemaining = gameState.coins.filter((c) => c.type === 'BLACK' && !c.pocketed).length;
      gameState.whitePocketedCount = 9 - whiteRemaining;
      gameState.blackPocketedCount = 9 - blackRemaining;

      const whiteHasQueen =
        gameState.queenState === 'COVERED_WHITE' ||
        (gameState.queenState === 'PENDING_COVER' && gameState.queenPendingColor === 'WHITE');
      const blackHasQueen =
        gameState.queenState === 'COVERED_BLACK' ||
        (gameState.queenState === 'PENDING_COVER' && gameState.queenPendingColor === 'BLACK');

      renderCoinTray(p1CoinsEl, 9, gameState.whitePocketedCount, 'filled-white', true, whiteHasQueen);
      renderCoinTray(p2CoinsEl, 9, gameState.blackPocketedCount, 'filled-black', true, blackHasQueen);

      if (p1NearWinEl) {
        p1NearWinEl.innerHTML = whiteRemaining <= 2 && whiteRemaining > 0
          ? `<span class="near-win-badge">🔥 ${whiteRemaining} LEFT</span>`
          : '';
      }
      if (p2NearWinEl) {
        p2NearWinEl.innerHTML = blackRemaining <= 2 && blackRemaining > 0
          ? `<span class="near-win-badge">🔥 ${blackRemaining} LEFT</span>`
          : '';
      }

      if (mode === 'AI') {
        p1NameEl.textContent = 'White (You)';
        p2NameEl.textContent = 'Black (AI)';
      } else if (mode === 'PVP') {
        p1NameEl.textContent = 'White (P1)';
        p2NameEl.textContent = 'Black (P2)';
      } else {
        p1NameEl.textContent = myRole === 'WHITE' ? 'White (You)' : 'White (Peer)';
        p2NameEl.textContent = myRole === 'BLACK' ? 'Black (You)' : 'Black (Peer)';
      }

      turnIndicator.textContent = `${gameState.turn}'S TURN`;
      turnIndicator.classList.toggle('black-turn', gameState.turn === 'BLACK');

      p1BoxEl.classList.toggle('dimmed', gameState.turn !== 'WHITE');
      p2BoxEl.classList.toggle('dimmed', gameState.turn !== 'BLACK');

      if (gameState.queenState === 'ON_BOARD') {
        queenStatusEl.textContent = 'QUEEN: ON BOARD';
      } else if (gameState.queenState === 'PENDING_COVER') {
        queenStatusEl.textContent = `QUEEN: COVER (${gameState.queenPendingColor})`;
      } else if (gameState.queenState === 'COVERED_WHITE') {
        queenStatusEl.textContent = 'QUEEN: COVERED (WHITE)';
      } else if (gameState.queenState === 'COVERED_BLACK') {
        queenStatusEl.textContent = 'QUEEN: COVERED (BLACK)';
      }
    }

    function triggerVictoryCelebration(winnerColor, reasonText) {
      gameState.phase = 'GAME_OVER';
      gameState.winner = winnerColor;
      gameState.winReason = reasonText;
      updateScoreboard();
      SoundFX.playVictory();

      const heading = document.getElementById('winner-heading');
      const subtitle = document.getElementById('winner-subtitle');
      document.getElementById('final-white-score').textContent = gameState.whitePocketedCount;
      document.getElementById('final-black-score').textContent = gameState.blackPocketedCount;

      if (mode === 'AI') {
        heading.textContent = winnerColor === 'WHITE' ? 'YOU WIN THE MATCH!' : 'AI WINS THE MATCH!';
      } else if (mode === 'ONLINE') {
        heading.textContent = winnerColor === myRole ? 'YOU WIN THE MATCH!' : `${winnerColor} WINS!`;
      } else {
        heading.textContent = `${winnerColor} WINS THE MATCH!`;
      }
      subtitle.textContent = reasonText || 'All target coins pocketed cleanly.';

      victoryModal.classList.add('open');
      startConfetti();
    }

    function startConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      confettiCanvas.classList.add('open');
      const cctx = confettiCanvas.getContext('2d');
      const colors = ['#22d3ee', '#f59e0b', '#f43f5e', '#10b981', '#ffffff', '#a855f7'];
      confettiParticles = Array.from({ length: 130 }, () => ({
        x: Math.random() * confettiCanvas.width,
        y: Math.random() * -confettiCanvas.height,
        w: 6 + Math.random() * 7,
        h: 4 + Math.random() * 6,
        vx: (Math.random() - 0.5) * 3.5,
        vy: 2.2 + Math.random() * 4.2,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.16,
        color: colors[Math.floor(Math.random() * colors.length)],
      }));

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      function renderConfetti() {
        cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        for (const p of confettiParticles) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          if (p.y > confettiCanvas.height + 20) {
            p.y = -15;
            p.x = Math.random() * confettiCanvas.width;
          }
          cctx.save();
          cctx.translate(p.x, p.y);
          cctx.rotate(p.rot);
          cctx.fillStyle = p.color;
          cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          cctx.restore();
        }
        confettiAnimId = requestAnimationFrame(renderConfetti);
      }
      renderConfetti();
    }

    function stopConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      confettiCanvas.classList.remove('open');
      const cctx = confettiCanvas.getContext('2d');
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    /* =========================================================
       TURN RESOLUTION & CARROM QUEEN RULES
       ========================================================= */
    function resolveTurnOutcome() {
      const currentTurn = gameState.turn;
      const ownColor = currentTurn;
      const opponentColor = currentTurn === 'WHITE' ? 'BLACK' : 'WHITE';

      const pocketedOwn = gameState.pocketedThisTurn.filter((c) => c.type === ownColor);
      const pocketedOpp = gameState.pocketedThisTurn.filter((c) => c.type === opponentColor);
      const pocketedQueen = gameState.pocketedThisTurn.some((c) => c.type === 'QUEEN');
      const strikerFoul = gameState.strikerPocketedThisTurn;

      if (strikerFoul) {
        SoundFX.playFoul();
        penaltyReturnCoin(ownColor);
        if (gameState.queenPendingColor === currentTurn) {
          returnQueenToCenter();
        }
      }

      if (gameState.queenPendingColor === currentTurn && !strikerFoul) {
        if (pocketedOwn.length > 0) {
          gameState.queenState = currentTurn === 'WHITE' ? 'COVERED_WHITE' : 'COVERED_BLACK';
          gameState.queenPendingColor = null;
        } else {
          returnQueenToCenter();
        }
      }

      if (pocketedQueen && !strikerFoul && gameState.queenState === 'ON_BOARD') {
        if (pocketedOwn.length > 0) {
          gameState.queenState = currentTurn === 'WHITE' ? 'COVERED_WHITE' : 'COVERED_BLACK';
          gameState.queenPendingColor = null;
        } else {
          gameState.queenState = 'PENDING_COVER';
          gameState.queenPendingColor = currentTurn;
        }
      } else if (pocketedQueen && strikerFoul) {
        returnQueenToCenter();
      }

      updateScoreboard();

      const whiteRemaining = gameState.coins.filter((c) => c.type === 'WHITE' && !c.pocketed).length;
      const blackRemaining = gameState.coins.filter((c) => c.type === 'BLACK' && !c.pocketed).length;

      if (whiteRemaining === 0) {
        const queenSecured = gameState.queenState !== 'ON_BOARD' && gameState.queenState !== 'PENDING_COVER';
        if (queenSecured || gameState.queenState === 'COVERED_BLACK') {
          triggerVictoryCelebration('WHITE', 'All White coins pocketed with Queen settled!');
          broadcastStateIfOnline();
          return;
        } else {
          returnQueenToCenter();
          updateScoreboard();
        }
      }

      if (blackRemaining === 0) {
        const queenSecured = gameState.queenState !== 'ON_BOARD' && gameState.queenState !== 'PENDING_COVER';
        if (queenSecured || gameState.queenState === 'COVERED_WHITE') {
          triggerVictoryCelebration('BLACK', 'All Black coins pocketed with Queen settled!');
          broadcastStateIfOnline();
          return;
        } else {
          returnQueenToCenter();
          updateScoreboard();
        }
      }

      const keepsTurn = !strikerFoul && (pocketedOwn.length > 0 || pocketedQueen || gameState.queenPendingColor === currentTurn);

      if (!keepsTurn) {
        gameState.turn = opponentColor;
      }

      gameState.pocketedThisTurn = [];
      gameState.strikerPocketedThisTurn = false;
      resetStrikerForTurn();
      gameState.phase = 'AIM';
      updateScoreboard();
      resetTurnTimer();
      broadcastStateIfOnline();

      if (mode === 'AI' && gameState.turn === 'BLACK' && gameState.phase === 'AIM') {
        scheduleAITurn();
      }
    }

    /* =========================================================
       SUB-STEP PHYSICS & COLLISION ENGINE
       ========================================================= */
    function spawnPocketParticles(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.3;
        const speed = 1.2 + Math.random() * 3.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color,
        });
      }
    }

    function checkPocket(disc, isStriker = false) {
      for (const p of POCKETS) {
        const dx = disc.x - p.x;
        const dy = disc.y - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < POCKET_RADIUS - disc.r * 0.22) {
          if (isStriker) {
            disc.active = false;
            disc.vx = 0;
            disc.vy = 0;
            gameState.strikerPocketedThisTurn = true;
            SoundFX.playFoul();
            spawnPocketParticles(p.x, p.y, '#ef4444');
          } else {
            disc.pocketed = true;
            disc.vx = 0;
            disc.vy = 0;
            gameState.pocketedThisTurn.push(disc);
            SoundFX.playPocket(disc.type === 'QUEEN');
            launchFlyingCoinToTray(disc);
            spawnPocketParticles(p.x, p.y, disc.type === 'QUEEN' ? '#f43f5e' : '#22d3ee');
          }
          return true;
        }
      }
      return false;
    }

    function collideWall(disc, restitution = 0.82) {
      const minX = PLAY_MIN + disc.r;
      const maxX = PLAY_MAX - disc.r;
      const minY = PLAY_MIN + disc.r;
      const maxY = PLAY_MAX - disc.r;

      let hit = false;
      if (disc.x < minX) {
        disc.x = minX;
        disc.vx = Math.abs(disc.vx) * restitution;
        hit = true;
      } else if (disc.x > maxX) {
        disc.x = maxX;
        disc.vx = -Math.abs(disc.vx) * restitution;
        hit = true;
      }

      if (disc.y < minY) {
        disc.y = minY;
        disc.vy = Math.abs(disc.vy) * restitution;
        hit = true;
      } else if (disc.y > maxY) {
        disc.y = maxY;
        disc.vy = -Math.abs(disc.vy) * restitution;
        hit = true;
      }

      if (hit) {
        const spd = Math.hypot(disc.vx, disc.vy);
        if (spd > 1.2) SoundFX.playClick(spd / 12);
      }
    }

    function resolveDiscPairCollision(a, b, massA = 1, massB = 1, restitution = 0.9) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = a.r + b.r;

      if (dist <= 0.0001 || dist >= minDist) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;

      const totalMass = massA + massB;
      a.x -= nx * overlap * (massB / totalMass);
      a.y -= ny * overlap * (massB / totalMass);
      b.x += nx * overlap * (massA / totalMass);
      b.y += ny * overlap * (massA / totalMass);

      const rvx = b.vx - a.vx;
      const rvy = b.vy - a.vy;
      const velAlongNormal = rvx * nx + rvy * ny;

      if (velAlongNormal > 0) return;

      const impulse = (-(1 + restitution) * velAlongNormal) / (1 / massA + 1 / massB);
      const impulseX = impulse * nx;
      const impulseY = impulse * ny;

      a.vx -= impulseX / massA;
      a.vy -= impulseY / massA;
      b.vx += impulseX / massB;
      b.vy += impulseY / massB;

      const impactMag = Math.abs(velAlongNormal);
      if (impactMag > 1.1) {
        SoundFX.playClick(impactMag / 11);
      }
    }

    function stepPhysics() {
      if (gameState.phase !== 'MOVING') return;

      const activeCoins = gameState.coins.filter((c) => !c.pocketed);
      const striker = gameState.striker;

      for (let s = 0; s < SUBSTEPS; s++) {
        for (const c of activeCoins) {
          c.x += c.vx / SUBSTEPS;
          c.y += c.vy / SUBSTEPS;
          checkPocket(c, false);
          if (!c.pocketed) collideWall(c, 0.82);
        }

        if (striker.active) {
          striker.x += striker.vx / SUBSTEPS;
          striker.y += striker.vy / SUBSTEPS;
          checkPocket(striker, true);
          if (striker.active) collideWall(striker, 0.84);
        }

        const stillCoins = gameState.coins.filter((c) => !c.pocketed);
        for (let i = 0; i < stillCoins.length; i++) {
          for (let j = i + 1; j < stillCoins.length; j++) {
            resolveDiscPairCollision(stillCoins[i], stillCoins[j], 1, 1, 0.9);
          }
          if (striker.active) {
            resolveDiscPairCollision(striker, stillCoins[i], 2.1, 1, 0.92);
          }
        }
      }

      const frictionStep = Math.pow(FRICTION, 1);
      let anyMoving = false;

      for (const c of gameState.coins) {
        if (c.pocketed) continue;
        c.vx *= frictionStep;
        c.vy *= frictionStep;
        const spd = Math.hypot(c.vx, c.vy);
        if (spd < MIN_SPEED) {
          c.vx = 0;
          c.vy = 0;
        } else {
          anyMoving = true;
        }
      }

      if (striker.active) {
        striker.vx *= frictionStep;
        striker.vy *= frictionStep;
        const sSpd = Math.hypot(striker.vx, striker.vy);
        if (sSpd < MIN_SPEED) {
          striker.vx = 0;
          striker.vy = 0;
        } else {
          anyMoving = true;
        }
      }

      if (!anyMoving) {
        gameState.phase = 'RESOLVING';
        resolveTurnOutcome();
      }
    }

    /* =========================================================
       SMART AI OPPONENT (BLACK)
       ========================================================= */
    function scheduleAITurn() {
      if (aiTimeoutId) clearTimeout(aiTimeoutId);
      aiTimeoutId = setTimeout(() => {
        if (isSiteUpdating) return;
        if (mode !== 'AI' || gameState.turn !== 'BLACK' || gameState.phase !== 'AIM') return;

        const targetCoins = gameState.coins.filter(
          (c) => !c.pocketed && (c.type === 'BLACK' || (c.type === 'QUEEN' && gameState.queenState === 'ON_BOARD'))
        );
        const fallbackCoins = gameState.coins.filter((c) => !c.pocketed);
        const candidates = targetCoins.length > 0 ? targetCoins : fallbackCoins;

        if (candidates.length === 0) return;

        let bestShot = null;
        for (let sx = BASELINE_MIN_X; sx <= BASELINE_MAX_X; sx += 25) {
          const sy = BLACK_BASELINE_Y;
          for (const coin of candidates) {
            for (const pocket of POCKETS) {
              const pDx = pocket.x - coin.x;
              const pDy = pocket.y - coin.y;
              const pDist = Math.hypot(pDx, pDy) || 1;
              const ghostX = coin.x - (pDx / pDist) * (coin.r + gameState.striker.r);
              const ghostY = coin.y - (pDy / pDist) * (coin.r + gameState.striker.r);

              const sDx = ghostX - sx;
              const sDy = ghostY - sy;
              const sDist = Math.hypot(sDx, sDy) || 1;

              const score = pDist * 1.15 + sDist * 0.45 + (coin.type === 'BLACK' ? -45 : 15);
              if (!bestShot || score < bestShot.score) {
                bestShot = { sx, sy, vx: (sDx / sDist) * 18.5, vy: (sDy / sDist) * 18.5, score };
              }
            }
          }
        }

        if (bestShot) {
          posSlider.value = bestShot.sx;
          gameState.striker.x = bestShot.sx;
          gameState.striker.y = bestShot.sy;
          gameState.striker.active = true;
          gameState.striker.vx = bestShot.vx;
          gameState.striker.vy = bestShot.vy;
          gameState.pocketedThisTurn = [];
          gameState.strikerPocketedThisTurn = false;
          gameState.phase = 'MOVING';
          SoundFX.playStrike(0.75);
          updateScoreboard();
        }
      }, 650);
    }

    /* =========================================================
       CANVAS RENDERING (CARROM BOARD, COINS, STRIKER & AIM)
       ========================================================= */
    function drawBoard() {
      ctx.clearRect(0, 0, BOARD_SIZE, BOARD_SIZE);

      const frameGrad = ctx.createLinearGradient(0, 0, BOARD_SIZE, BOARD_SIZE);
      frameGrad.addColorStop(0, '#4a2511');
      frameGrad.addColorStop(0.5, '#7c3f1d');
      frameGrad.addColorStop(1, '#3b1c0c');
      ctx.fillStyle = frameGrad;
      ctx.beginPath();
      ctx.roundRect(8, 8, BOARD_SIZE - 16, BOARD_SIZE - 16, 26);
      ctx.fill();

      ctx.strokeStyle = 'rgba(251, 191, 36, 0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      const surfGrad = ctx.createRadialGradient(300, 300, 40, 300, 300, 360);
      surfGrad.addColorStop(0, '#f6dfb0');
      surfGrad.addColorStop(0.75, '#e7c588');
      surfGrad.addColorStop(1, '#d5ae6c');
      ctx.fillStyle = surfGrad;
      ctx.beginPath();
      ctx.roundRect(PLAY_MIN, PLAY_MIN, PLAY_MAX - PLAY_MIN, PLAY_MAX - PLAY_MIN, 14);
      ctx.fill();

      ctx.strokeStyle = '#5c3317';
      ctx.lineWidth = 3;
      ctx.stroke();

      for (const p of POCKETS) {
        const pGrad = ctx.createRadialGradient(p.x - 4, p.y - 4, 3, p.x, p.y, POCKET_RADIUS);
        pGrad.addColorStop(0, '#27272a');
        pGrad.addColorStop(0.65, '#09090b');
        pGrad.addColorStop(1, '#000000');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.save();
      ctx.strokeStyle = 'rgba(120, 53, 15, 0.55)';
      ctx.lineWidth = 1.6;

      ctx.beginPath();
      ctx.arc(300, 300, 68, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(300, 300, 14, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(300 + Math.cos(a) * 16, 300 + Math.sin(a) * 16);
        ctx.lineTo(300 + Math.cos(a) * 66, 300 + Math.sin(a) * 66);
        ctx.stroke();
      }

      const drawBaseline = (y) => {
        ctx.beginPath();
        ctx.moveTo(BASELINE_MIN_X, y - 10);
        ctx.lineTo(BASELINE_MAX_X, y - 10);
        ctx.moveTo(BASELINE_MIN_X, y + 10);
        ctx.lineTo(BASELINE_MAX_X, y + 10);
        ctx.stroke();

        for (const endX of [BASELINE_MIN_X, BASELINE_MAX_X]) {
          ctx.beginPath();
          ctx.arc(endX, y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#dc2626';
          ctx.fill();
          ctx.stroke();
        }
      };

      drawBaseline(WHITE_BASELINE_Y);
      drawBaseline(BLACK_BASELINE_Y);
      ctx.restore();

      for (const coin of gameState.coins) {
        if (coin.pocketed) continue;
        drawCoin(coin);
      }

      if (gameState.striker.active) {
        drawStriker(gameState.striker);
      }

      if (aimDrag.active && gameState.phase === 'AIM') {
        drawAimGuide();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawCoin(coin) {
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetY = 2.5;

      const grad = ctx.createRadialGradient(
        coin.x - coin.r * 0.3,
        coin.y - coin.r * 0.3,
        2,
        coin.x,
        coin.y,
        coin.r
      );

      if (coin.type === 'WHITE') {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.75, '#f1f5f9');
        grad.addColorStop(1, '#cbd5e1');
      } else if (coin.type === 'BLACK') {
        grad.addColorStop(0, '#475569');
        grad.addColorStop(0.7, '#1e293b');
        grad.addColorStop(1, '#090d16');
      } else {
        grad.addColorStop(0, '#fb7185');
        grad.addColorStop(0.65, '#e11d48');
        grad.addColorStop(1, '#881337');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = coin.type === 'WHITE' ? '#94a3b8' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.r * 0.48, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawStriker(striker) {
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 7;
      ctx.shadowOffsetY = 3;

      const grad = ctx.createRadialGradient(
        striker.x - striker.r * 0.35,
        striker.y - striker.r * 0.35,
        3,
        striker.x,
        striker.y,
        striker.r
      );
      grad.addColorStop(0, '#ecfeff');
      grad.addColorStop(0.55, '#22d3ee');
      grad.addColorStop(1, '#0e7490');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(striker.x, striker.y, striker.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(striker.x, striker.y, striker.r * 0.52, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.stroke();
      ctx.restore();
    }

    function drawAimGuide() {
      const s = gameState.striker;
      const dx = aimDrag.startX - aimDrag.currX;
      const dy = aimDrag.startY - aimDrag.currY;
      const dist = Math.hypot(dx, dy);
      if (dist < 6) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const aimLen = 70 + aimDrag.powerRatio * 150;

      ctx.save();
      ctx.setLineDash([7, 6]);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = aimDrag.powerRatio > 0.75 ? '#ef4444' : '#22d3ee';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + nx * aimLen, s.y + ny * aimLen);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(s.x + nx * aimLen, s.y + ny * aimLen, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      ctx.restore();
    }

    /* =========================================================
       INPUT HANDLING (SLIDER & POINTER AIM/SHOOT)
       ========================================================= */
    function canCurrentUserControl() {
      if (isSiteUpdating) return false;
      if (gameState.phase !== 'AIM') return false;
      if (mode === 'AI') return gameState.turn === 'WHITE';
      if (mode === 'PVP') return true;
      if (mode === 'ONLINE') return gameState.turn === myRole;
      return false;
    }

    posSlider.addEventListener('input', (e) => {
      if (!canCurrentUserControl()) {
        e.target.value = gameState.striker.x;
        return;
      }
      const val = Number(e.target.value);
      gameState.striker.x = val;
      gameState.striker.y = getBaselineYForTurn(gameState.turn);
      gameState.striker.active = true;
      broadcastStateIfOnline();
    });

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * BOARD_SIZE,
        y: ((clientY - rect.top) / rect.height) * BOARD_SIZE,
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!canCurrentUserControl()) return;
      const pt = getCanvasCoords(e.clientX, e.clientY);
      const s = gameState.striker;
      const distToStriker = Math.hypot(pt.x - s.x, pt.y - s.y);

      if (distToStriker <= s.r * 2.4) {
        canvas.setPointerCapture(e.pointerId);
        aimDrag.active = true;
        aimDrag.startX = s.x;
        aimDrag.startY = s.y;
        aimDrag.currX = pt.x;
        aimDrag.currY = pt.y;
        aimDrag.powerRatio = 0;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!aimDrag.active) return;
      const pt = getCanvasCoords(e.clientX, e.clientY);
      aimDrag.currX = pt.x;
      aimDrag.currY = pt.y;

      const pullDist = Math.hypot(aimDrag.startX - pt.x, aimDrag.startY - pt.y);
      const maxPull = 135;
      aimDrag.powerRatio = Math.min(1, pullDist / maxPull);
      powerFill.style.width = `${Math.round(aimDrag.powerRatio * 100)}%`;
    });

    function releaseAim(e) {
      if (!aimDrag.active) return;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

      const dx = aimDrag.startX - aimDrag.currX;
      const dy = aimDrag.startY - aimDrag.currY;
      const dist = Math.hypot(dx, dy);
      const powerRatio = aimDrag.powerRatio;

      aimDrag.active = false;
      aimDrag.powerRatio = 0;
      powerFill.style.width = '0%';

      if (dist < 10 || powerRatio < 0.08 || !canCurrentUserControl()) {
        return;
      }

      const nx = dx / dist;
      const ny = dy / dist;
      const speed = Math.max(4.5, powerRatio * MAX_SHOT_POWER);

      gameState.striker.vx = nx * speed;
      gameState.striker.vy = ny * speed;
      gameState.striker.active = true;
      gameState.lastShotPower = speed;
      gameState.pocketedThisTurn = [];
      gameState.strikerPocketedThisTurn = false;
      gameState.phase = 'MOVING';

      SoundFX.playStrike(powerRatio);
      broadcastStateIfOnline();
    }

    canvas.addEventListener('pointerup', releaseAim);
    canvas.addEventListener('pointercancel', releaseAim);

    /* =========================================================
       MODE SWITCHING & ONLINE MULTIPLAYER (SUPABASE REALTIME)
       ========================================================= */
    const btnAi = document.getElementById('btn-ai');
    const btnPvp = document.getElementById('btn-pvp');
    const btnOnline = document.getElementById('btn-online');
    const btnMic = document.getElementById('btn-mic');
    const btnSound = document.getElementById('btn-sound');

    const onlineWarningModal = document.getElementById('online-warning-modal');
    const onlineModal = document.getElementById('online-modal');
    const onlineStatus = document.getElementById('online-status');
    const createdRoomArea = document.getElementById('created-room-area');
    const displayRoomCode = document.getElementById('display-room-code');
    const joinCodeInput = document.getElementById('join-code-input');

    function setModeButtons(activeMode) {
      btnAi.classList.toggle('active', activeMode === 'AI');
      btnPvp.classList.toggle('active', activeMode === 'PVP');
      btnOnline.classList.toggle('active', activeMode === 'ONLINE');
    }

    function setMode(newMode) {
      if (isSiteUpdating) {
        if (maintScreenEl) maintScreenEl.classList.add('active');
        return;
      }
      mode = newMode;
      setModeButtons(newMode);
      startNewGame(true);
    }

    function openOnlineWarningOrLobby() {
      if (isSiteUpdating) {
        if (maintScreenEl) maintScreenEl.classList.add('active');
        return;
      }
      const hasAccepted = sessionStorage.getItem('carrom_online_warn_accepted') === '1';
      if (hasAccepted) {
        onlineModal.classList.add('open');
      } else {
        onlineWarningModal.classList.add('open');
      }
    }

    btnAi.addEventListener('click', () => setMode('AI'));
    btnPvp.addEventListener('click', () => setMode('PVP'));
    btnOnline.addEventListener('click', () => openOnlineWarningOrLobby());

    document.getElementById('btn-accept-online').addEventListener('click', () => {
      sessionStorage.setItem('carrom_online_warn_accepted', '1');
      onlineWarningModal.classList.remove('open');
      onlineModal.classList.add('open');
    });

    document.getElementById('btn-cancel-online').addEventListener('click', () => {
      onlineWarningModal.classList.remove('open');
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      onlineModal.classList.remove('open');
    });

    btnSound.addEventListener('click', () => {
      const next = !SoundFX.isEnabled();
      SoundFX.setEnabled(next);
      btnSound.textContent = next ? 'Sound: ON' : 'Sound: OFF';
    });

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function connectToRoom(code, role) {
      if (!sb) {
        onlineStatus.textContent = 'Supabase Realtime unavailable.';
        onlineStatus.className = 'status-msg err';
        return;
      }

      if (roomChannel) {
        sb.removeChannel(roomChannel);
        roomChannel = null;
      }

      roomCode = code;
      myRole = role;
      mode = 'ONLINE';
      setModeButtons('ONLINE');
      startNewGame(true);

      roomChannel = sb.channel(`carrom-room-${code}`, {
        config: { broadcast: { self: false } },
      });

      roomChannel
        .on('broadcast', { event: 'game_state' }, ({ payload }) => {
          if (!payload || isSiteUpdating) return;
          isRemoteSyncing = true;
          Object.assign(gameState, payload.state);
          posSlider.value = gameState.striker.x;
          updateScoreboard();
          if (gameState.phase === 'GAME_OVER' && gameState.winner) {
            triggerVictoryCelebration(gameState.winner, gameState.winReason);
          }
          isRemoteSyncing = false;
        })
        .on('broadcast', { event: 'rtc_signal' }, async ({ payload }) => {
          if (!payload || payload.sender === myRole) return;
          await handleIncomingSignal(payload.signal);
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            onlineStatus.textContent = `Connected to Room ${code} as ${role}.`;
            onlineStatus.className = 'status-msg';
            if (role === 'WHITE') {
              broadcastStateIfOnline();
            }
          }
        });
    }

    function broadcastStateIfOnline() {
      if (isSiteUpdating) return;
      if (mode !== 'ONLINE' || !roomChannel || isRemoteSyncing) return;
      roomChannel.send({
        type: 'broadcast',
        event: 'game_state',
        payload: {
          sender: myRole,
          state: {
            turn: gameState.turn,
            phase: gameState.phase,
            coins: gameState.coins,
            striker: gameState.striker,
            queenState: gameState.queenState,
            queenPendingColor: gameState.queenPendingColor,
            whitePocketedCount: gameState.whitePocketedCount,
            blackPocketedCount: gameState.blackPocketedCount,
            winner: gameState.winner,
            winReason: gameState.winReason,
          },
        },
      });
    }

    document.getElementById('btn-create-room').addEventListener('click', () => {
      if (isSiteUpdating) return;
      const code = generateRoomCode();
      createdRoomArea.style.display = 'block';
      displayRoomCode.textContent = code;
      onlineStatus.textContent = 'Room created! Share code with opponent...';
      onlineStatus.className = 'status-msg';
      connectToRoom(code, 'WHITE');
    });

    displayRoomCode.addEventListener('click', () => {
      const code = displayRoomCode.textContent.trim();
      if (code && code !== '-----' && navigator.clipboard) {
        navigator.clipboard.writeText(code).catch(() => {});
        onlineStatus.textContent = `Copied code ${code} to clipboard!`;
        onlineStatus.className = 'status-msg';
      }
    });

    document.getElementById('btn-join-room').addEventListener('click', () => {
      if (isSiteUpdating) return;
      const code = joinCodeInput.value.trim().toUpperCase();
      if (code.length !== 5) {
        onlineStatus.textContent = 'Please enter a valid 5-character room code.';
        onlineStatus.className = 'status-msg err';
        return;
      }
      onlineModal.classList.remove('open');
      connectToRoom(code, 'BLACK');
    });

    window.addEventListener('offline', () => {
      if (mode === 'ONLINE' && roomCode && gameState.phase !== 'GAME_OVER') {
        gameState.phase = 'GAME_OVER';
        showInfoModal(
          'Connection Lost — No Winner',
          'Your internet connection dropped during the online match. The round ended with No Winner and no match points awarded.',
          () => setMode('AI')
        );
      }
    });

    /* =========================================================
       WEBRTC VOICE CHAT (ONLINE ROOMS)
       ========================================================= */
    async function ensurePeerConnection() {
      if (peerConnections.peer) return peerConnections.peer;
      const pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        let remoteAudio = document.getElementById('remote-voice-audio');
        if (!remoteAudio) {
          remoteAudio = document.createElement('audio');
          remoteAudio.id = 'remote-voice-audio';
          remoteAudio.autoplay = true;
          document.body.appendChild(remoteAudio);
        }
        remoteAudio.srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && roomChannel) {
          roomChannel.send({
            type: 'broadcast',
            event: 'rtc_signal',
            payload: { sender: myRole, signal: { candidate: event.candidate } },
          });
        }
      };

      peerConnections.peer = pc;
      return pc;
    }

    async function handleIncomingSignal(signal) {
      if (!signal || !roomChannel) return;
      const pc = await ensurePeerConnection();

      if (signal.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        if (signal.sdp.type === 'offer') {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          roomChannel.send({
            type: 'broadcast',
            event: 'rtc_signal',
            payload: { sender: myRole, signal: { sdp: pc.localDescription } },
          });
        }
      } else if (signal.candidate) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
        } catch (_) {}
      }
    }

    function stopVoiceChat() {
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      if (peerConnections.peer) {
        peerConnections.peer.close();
        delete peerConnections.peer;
      }
      micEnabled = false;
      btnMic.textContent = 'Mic: OFF';
      btnMic.classList.remove('active');
    }

    btnMic.addEventListener('click', async () => {
      if (isSiteUpdating) return;
      if (mode !== 'ONLINE' || !roomChannel) {
        showInfoModal('Online Room Required', 'Join or create an Online room first to use voice chat.');
        return;
      }

      if (!micEnabled) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          micEnabled = true;
          btnMic.textContent = 'Mic: ON';
          btnMic.classList.add('active');

          const pc = await ensurePeerConnection();
          if (myRole === 'WHITE') {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            roomChannel.send({
              type: 'broadcast',
              event: 'rtc_signal',
              payload: { sender: myRole, signal: { sdp: pc.localDescription } },
            });
          }
        } catch (_) {
          showInfoModal('Microphone Permission', 'Could not access microphone. Please allow mic permissions in your browser.');
        }
      } else {
        stopVoiceChat();
      }
    });

    /* =========================================================
       VICTORY MODAL ACTIONS & MAIN LOOP
       ========================================================= */
    document.getElementById('btn-play-again').addEventListener('click', () => {
      if (isSiteUpdating) return;
      startNewGame(true);
    });

    document.getElementById('btn-victory-home').addEventListener('click', () => {
      stopConfetti();
      victoryModal.classList.remove('open');
      if (isSiteUpdating) {
        if (maintScreenEl) maintScreenEl.classList.add('active');
        return;
      }
      if (homeScreenEl) homeScreenEl.classList.remove('hidden');
    });

    function gameLoop() {
      if (!isSiteUpdating) {
        stepPhysics();
        drawBoard();
      }
      requestAnimationFrame(gameLoop);
    }

    updateScoreboard();
    resetTurnTimer();
    loadSiteStatusFromSupabase().then(() => {
      subscribeToSiteStatus();
    });
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
